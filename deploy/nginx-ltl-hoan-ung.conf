# =========================================================================
# nginx — LtL Tạm ứng & Hoàn ứng (web tĩnh, PWA)
# Thay  hoanung.example.com  bằng tên miền thật, thư mục web /var/www/ltl-hoan-ung
# Bắt buộc HTTPS: camera chụp bill, service worker (chạy offline) và đăng nhập
# đều cần HTTPS. Cấp chứng chỉ miễn phí:  sudo certbot --nginx -d hoanung.example.com
# =========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name hoanung.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hoanung.example.com;

    # certbot tự điền 2 dòng dưới
    ssl_certificate     /etc/letsencrypt/live/hoanung.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoanung.example.com/privkey.pem;

    root  /var/www/ltl-hoan-ung;
    index index.html;
    charset utf-8;

    # Kiểu file (manifest PWA + font)
    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }

    # Nén để tải nhanh (các thư viện docx / exceljs ~1MB)
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Bảo mật cơ bản + cho phép camera trên chính trang này
    add_header Permissions-Policy "camera=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Service worker: KHÔNG được cache, để bản mới tới người dùng ngay sau mỗi lần cập nhật
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header Permissions-Policy "camera=(self)" always;
        try_files $uri =404;
    }

    # Thư viện, ảnh, mẫu Excel: cache lâu (đặt TRƯỚC khối .js để được ưu tiên)
    location ~* ^/(lib|icons|assets/templates)/ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Trang chính + code app: luôn kiểm tra bản mới
    location ~* \.(html|js|css|webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "camera=(self)" always;
        try_files $uri =404;
    }

    # Không lộ file cấu hình / mã nguồn phụ
    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/(supabase|deploy|robocon2026)/ { deny all; }
    location ~* \.(ps1|sql|md|conf)$ { deny all; }

    # App dùng định tuyến #/…, mọi đường dẫn khác trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
